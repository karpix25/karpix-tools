services:
  traefik:
    image: "traefik"
    restart: unless-stopped
    command:
      - "--api=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
  ncat:
    image: stephengpope/no-code-architects-toolkit:latest
    env_file:
      - .env
    environment:
      - GUNICORN_WORKERS=1
    labels:
      - traefik.enable=true
      - traefik.http.routers.ncat.rule=Host(`api.karpix.com`)
      - traefik.http.routers.ncat.tls=true
      - traefik.http.routers.ncat.entrypoints=web,websecure
      - traefik.http.routers.ncat.tls.certresolver=mytlschallenge
    volumes:
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    restart: unless-stopped
  mcp-server:
    build:
      context: ./karpix-mcp-server
      dockerfile: Dockerfile
    environment:
      - KARPIX_API_KEY=${API_KEY}
      - KARPIX_BASE_URL=http://ncat:8080
      - MCP_TRANSPORT=sse
      - PORT=3000
    labels:
      - traefik.enable=true
      - traefik.http.routers.mcp.rule=Host(`mcp.karpix.com`)
      - traefik.http.routers.mcp.tls=true
      - traefik.http.routers.mcp.entrypoints=web,websecure
      - traefik.http.routers.mcp.tls.certresolver=mytlschallenge
      - traefik.http.services.mcp.loadbalancer.server.port=3000
    restart: unless-stopped

volumes:
  traefik_data:
    driver: local
  storage:
    driver: local
  logs:
    driver: local
